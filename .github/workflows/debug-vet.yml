name: Debug Vet

on:
  workflow_dispatch:
  push:
    branches: ["feature/node-core"]

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Capture vet output
        run: |
          set +e
          go vet ./... > vet.txt 2>&1
          echo $? > vet.exit
      - uses: actions/upload-artifact@v4
        with:
          name: vet-debug
          path: |
            vet.txt
            vet.exit
